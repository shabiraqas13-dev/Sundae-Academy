<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sundae Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf6f5;
            --card-bg: #fff5f7;
            --primary-pink: #f2a7dc;
            --soft-purple: #d1c4e9;
            --warm-brown: #8d5b4c;
            --text-color: #5c4033;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .hero-card {
            background-color: var(--card-bg);
            border: 2px dashed var(--primary-pink);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(141, 91, 76, 0.05);
        }

        .logo-img {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 28px;
            color: var(--warm-brown);
            margin: 10px 0 5px 0;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: #7a6258;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-card">
            <!-- Menampilkan gambar logo -->
            <img src="Logo_Sundae_Academy.png" alt="Sundae Academy Logo" class="logo-img">
            
            <!-- Judul teks asli -->
            <h1>Sundae Academy</h1>
            <p>Joyful Learning</p>
        </div>
    </div>

</body>
</html>

</body>
</html>
